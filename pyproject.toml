[project]
name = "seqrec-llm-replication"
version = "1.0.0"
description = "Replication and extension of LLM-enhanced sequential recommendation (Harte et al. 2023 / Boz et al. 2024) on the original code"
requires-python = "==3.11.*"
dependencies = [
    # the original code (vendor/llmseqrec) pins TensorFlow 2.13; on Windows the wheel is tensorflow-intel
    "tensorflow==2.13.0",
    "tensorflow-intel==2.13.0; sys_platform == 'win32'",
    "tensorflow-io-gcs-filesystem==0.31.0",
    "pandas==1.5.3",
    "numpy==1.24.3",
    "scipy==1.10.1",
    "scikit-learn==1.3.2",
    "numba==0.57.1",
    "multiprocess",
    "tenacity",
    "jinja2",
    # open-source text embeddings without torch (ONNX); onnxruntime 1.31 crashes with numpy 1.24
    "fastembed",
    "onnxruntime==1.19.2",
    "matplotlib",
    "tqdm",
    "psutil",
    "pytest",
]

[tool.uv]
package = false
